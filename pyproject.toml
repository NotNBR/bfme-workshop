[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bmfe-workshop"
version = "0.1.0"
description = "BFME2 tooling, native mods, documentation and reproducible examples"
requires-python = ">=3.11"
dependencies = ["capstone==5.0.7", "pefile==2024.8.26", "Pillow==12.3.0", "numpy==2.5.3"]

[project.optional-dependencies]
video = ["imageio-ffmpeg==0.6.0"]

[project.scripts]
workshop = "cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["cli*", "common*", "host*", "formats*", "mapkit*", "capture*", "video*", "scenarios*", "strategic*", "examples.maps*", "examples.showcases*", "mods.recoil.tools*"]
exclude = ["*.tests", "*.tests.*", "*.__pycache__*"]


[tool.setuptools.package-data]
"mapkit" = ["*.mjs", "data/*.json"]
