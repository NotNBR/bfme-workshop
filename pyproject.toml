[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bfmexbar"
version = "0.1.0"
description = "BFME2 strategic controls, reproducible maps and gameplay showcases"
requires-python = ">=3.11"
dependencies = ["capstone==5.0.7", "pefile==2024.8.26", "Pillow==12.3.0", "numpy==2.5.3"]

[project.optional-dependencies]
video = ["imageio-ffmpeg==0.6.0"]

[project.scripts]
bfx = "bfmexbar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bfmexbar*", "tools*", "legacy.recoil*"]


[tool.setuptools.package-data]
"bfmexbar.mapkit" = ["*.mjs"]
